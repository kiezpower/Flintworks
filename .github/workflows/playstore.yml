# Signiertes App-Bundle (AAB) für den Google Play Store. Läuft bei einem Tag "v*" oder von Hand.
# Braucht die Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD (Upload-Schlüssel, siehe docs/PLAYSTORE.md).
name: Play-Store-Bundle bauen

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schlüssel vorhanden?
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt – siehe docs/PLAYSTORE.md"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK vorbereiten
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm ci
      - run: npm run android
      - name: Bundle bauen und signieren
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          export VERSION_CODE=$(( 100 + ${{ github.run_number }} ))
          export VERSION_NAME=$(node -p "require('../package.json').version")
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../flintworks.aab
      - uses: actions/upload-artifact@v4
        with:
          name: flintworks-aab
          path: flintworks.aab
