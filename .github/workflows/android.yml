# Baut bei jedem Push eine installierbare Android-App (APK) und hängt sie an ein Release.
name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK vorbereiten
        # Das SDK ist auf dem Runner vorinstalliert; nur Lizenzen und die benötigte Plattform ergänzen
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm ci
      - run: npm run android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          export VERSION_CODE=${{ github.run_number }}
          export VERSION_NAME=$(node -p "require('../package.json').version")
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk flintworks.apk
      - uses: actions/upload-artifact@v4
        with:
          name: flintworks-apk
          path: flintworks.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Flintworks Android ${{ github.run_number }}
          body: APK zum Installieren auf Android. Automatisch gebaut aus ${{ github.sha }}.
          files: flintworks.apk
          make_latest: true
      # dieselbe APK auch auf itch.io (Kanal "android"), wenn der Zugang eingerichtet ist (docs/ITCH.md)
      - name: Auf itch.io hochladen
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "::notice::itch.io-Zugang fehlt – APK-Upload übersprungen"
            exit 0
          fi
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler push flintworks.apk "$ITCH_GAME:android" --userversion "$(node -p "require('./package.json').version")"
