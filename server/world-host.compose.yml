# Optional dedicated world. The ordinary relay remains a separate, small service.
# From the repository root: docker compose -f server/world-host.compose.yml up -d --build
services:
  world:
    build:
      context: ..
      dockerfile: server/world-host.Dockerfile
    restart: unless-stopped
    init: true
    shm_size: 256mb
    environment:
      WORLD_NAME: Unser Bergwerk
      WORLD_BIOME: meadow
      WORLD_DIFFICULTY: adventure
      WORLD_PUBLIC: 'true'
      WORLD_RELAY_URL: wss://play.kiez-power.de
      WORLD_HTTP_PORT: '8790'
    volumes:
      - world-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  world-data:
