# Runs on the dogado vServer next to the kiez-power apps. The relay joins their Docker network,
# so the existing Caddy (kiezpower-caddy) serves wss://play.kiez-power.de → flintworks-relay:8787.
services:
  relay:
    image: ghcr.io/kiezpower/flintworks-relay:${IMAGE_TAG:-latest}
    container_name: flintworks-relay
    restart: unless-stopped
    environment:
      - PORT=8787
    networks:
      - kiezpower-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  kiezpower-net:
    external: true
