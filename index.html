<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>Flintworks</title>
    <meta
      name="description"
      content="Grabe, baue und sprenge dich durch eine Pixelwelt – ein Aufbauspiel im Stil der Klassiker."
    />
    <meta name="theme-color" content="#1a120c" />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flintworks" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap"
    />
  </head>
  <body>
    <div id="game">
      <canvas id="cv" aria-label="Spielwelt"></canvas>

      <div id="hud">
        <div class="col">
          <div class="crew panel" id="crew"></div>
          <div class="stats panel">
            <div class="who" id="whoTxt"></div>
            <div class="who pwr" id="pwrTxt" hidden></div>
            <div class="money"><span class="coin"></span><span id="moneyTxt">0</span></div>
            <div class="bar" title="Energie"><b id="hpBar"></b></div>
            <div class="bar air" id="airWrap" hidden title="Luft"><b id="airBar"></b></div>
          </div>
        </div>
        <div class="colr">
          <div class="inv panel" id="inv"></div>
          <div class="tools">
            <button class="small" id="buildBtn">Bauen</button>
            <button class="small off" id="grpBtn" title="Crew folgt dem gewählten Wühler">Folgen</button>
            <button class="small" id="zoomBtn" title="Zoom">Zoom</button>
            <button class="small" id="mapBtn">Karte</button>
            <button class="small" id="sndBtn">Ton</button>
            <button class="small" id="newBtn">Neu</button>
          </div>
        </div>
      </div>

      <div id="pads">
        <div id="joy"><div id="knob"></div></div>
        <div id="btns">
          <button class="pad act" data-b="act" id="actBtn">Bauen</button>
          <button class="pad jump" data-b="jump">Sprung</button>
          <button class="pad throw" data-b="throw">Wurf</button>
          <button class="pad big" data-b="dig">Graben</button>
        </div>
      </div>

      <div id="mapView" class="panel" hidden>
        <div class="ph"><span style="color: var(--gold)">Karte · Antippen schließt</span></div>
        <canvas id="mini" width="350" height="100"></canvas>
        <div class="legend">
          <span><i style="background: #fff"></i>gewählt</span
          ><span><i style="background: #3f9e4a"></i>Crew</span
          ><span><i style="background: #c9b89a"></i>Gebäude</span
          ><span><i style="background: #ff4040"></i>Monster</span
          ><span><i style="background: #f2c230"></i>Gold</span
          ><span><i style="background: #ff7a2a"></i>Lava</span
          ><span><i style="background: #7ed957"></i>Säure</span>
        </div>
      </div>

      <div id="toast" class="panel" hidden></div>

      <div id="panel" class="panel" hidden>
        <div class="ph">
          <h2 id="pTitle"></h2>
          <button class="small" id="pClose">Schließen</button>
        </div>
        <div id="pBody"></div>
      </div>

      <div id="overlay">
        <div class="card panel" id="card"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
