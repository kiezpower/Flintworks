<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <title>Flintworks</title>
    <meta
      name="description"
      content="Grabe, baue und sprenge dich durch eine Pixelwelt – ein Aufbauspiel im Stil der Klassiker."
    />
    <meta name="theme-color" content="#1a120c" />
    <!-- the card WhatsApp, Telegram, Discord & co. show for an invite link -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flintworks" />
    <meta property="og:title" content="Flintworks – grab mit!" />
    <meta
      property="og:description"
      content="Grabe, baue und sprenge dich zusammen mit Freunden durch eine Pixelwelt. Tippe auf den Link und du bist im Raum."
    />
    <meta property="og:url" content="https://kiezpower.github.io/Flintworks/" />
    <meta property="og:image" content="https://kiezpower.github.io/Flintworks/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ein Wühler steht vor seiner Burg, daneben zwei Plätze für Mitspieler" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="icons/favicon.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flintworks" />
  </head>
  <body>
    <div id="game">
      <canvas id="cv" aria-label="Spielwelt" data-i18n-aria="Spielwelt"></canvas>

      <div id="hud">
        <div class="col">
          <div class="crew panel" id="crew"></div>
          <div class="purse panel">
            <div class="money"><span class="coin"></span><span id="moneyTxt">0</span></div>
            <div class="goal" id="goalWrap" hidden>
              <span id="goalTxt"></span><span class="gbar"><b id="goalBar"></b></span>
            </div>
          </div>
          <div class="status panel" id="statusBox" hidden>
            <span class="bar air" id="airWrap" hidden title="Luft" data-i18n-title="Luft"><b id="airBar"></b></span>
            <span class="net" id="netTxt" hidden></span>
          </div>
        </div>
        <div class="mis panel" id="misTxt" hidden></div>
        <div class="colr">
          <div class="inv panel" id="inv"></div>
          <div class="tools">
            <button class="small" id="buildBtn" data-i18n="Bauen">Bauen</button>
            <button class="small" id="emoBtn" hidden aria-label="Zuruf">💬</button>
            <button class="small" id="menuBtn" data-i18n="Menü">Menü</button>
          </div>
          <canvas id="miniThumb" width="175" height="50" aria-label="Karte" data-i18n-aria="Karte"></canvas>
          <div class="store panel" id="storeRow" hidden></div>
          <div hidden>
            <button id="zoomBtn">Zoom</button>
            <button id="mapBtn">Karte</button>
            <button id="sndBtn">Ton</button>
            <button id="newBtn">Lobby</button>
          </div>
        </div>
      </div>

      <div id="pads">
        <div id="joy"><div id="knob"></div></div>
        <div id="btns">
          <button class="pad act" data-b="act"><i class="ico" data-ico="act"></i><span id="actBtn">Bauen</span></button>
          <button class="pad jump" data-b="jump">
            <i class="ico" data-ico="jump"></i><span data-i18n="Sprung">Sprung</span>
          </button>
          <button class="pad throw" data-b="throw">
            <i class="ico" data-ico="throw"></i><span data-i18n="Wurf">Wurf</span>
          </button>
          <button class="pad big" data-b="dig">
            <i class="ico" data-ico="dig"></i><span data-i18n="Graben">Graben</span>
          </button>
        </div>
      </div>

      <div id="mapView" class="panel" hidden>
        <div class="ph">
          <span style="color: var(--gold)" data-i18n="Karte · Antippen schließt">Karte · Antippen schließt</span>
        </div>
        <canvas id="mini" width="350" height="100"></canvas>
        <div class="legend">
          <span><i style="background: #fff"></i><span data-i18n="gewählt">gewählt</span></span
          ><span><i style="background: #3f9e4a"></i>Crew</span
          ><span><i style="background: #c9b89a"></i><span data-i18n="Gebäude">Gebäude</span></span
          ><span><i style="background: #ff4040"></i>Monster</span><span><i style="background: #f2c230"></i>Gold</span
          ><span><i style="background: #ff7a2a"></i>Lava</span
          ><span><i style="background: #7ed957"></i><span data-i18n="Säure">Säure</span></span>
        </div>
      </div>

      <div id="quest" class="panel" hidden>
        <span id="questStep"></span><span id="questText"></span>
        <button class="small" id="questSkip" data-i18n="Überspringen">Überspringen</button>
      </div>

      <div id="toast" class="panel" hidden></div>
      <a id="updateLink" class="go" hidden target="_blank" rel="noopener"></a>
      <button id="updateBtn" class="go" hidden data-i18n="Neue Version – tippen zum Laden">
        Neue Version – tippen zum Laden
      </button>

      <!-- behind an open panel: a tap next to it closes it -->
      <div id="panelBg" hidden></div>
      <div id="panel" class="panel" hidden>
        <div class="ph">
          <h2 id="pTitle"></h2>
          <button class="small" id="pClose" data-i18n="Schließen">Schließen</button>
        </div>
        <div id="pBody"></div>
      </div>

      <div id="overlay" hidden>
        <div class="card panel" id="card"></div>
      </div>

      <div id="lobby" hidden>
        <canvas id="lbCv" width="400" height="220" aria-label="Dein Wühler" data-i18n-aria="Dein Wühler"></canvas>
        <div class="lb-top">
          <div class="lb-logo">
            <b id="lbTitle">Flintworks</b>
          </div>
          <div class="lb-chips">
            <!-- the level and its XP; the daily quests bring XP, so they open here -->
            <button class="lb-lvl" id="lbLvlBtn" aria-label="Aufgaben" data-i18n-aria="Aufgaben">
              <b id="lbLvl">1</b>
              <span class="lb-xp"><i id="lbXp"></i><span id="lbXpTxt"></span></span>
            </button>
            <button class="chip lb-opt" id="lbOpt" aria-label="Optionen" data-i18n-aria="Optionen">
              <i class="ico" data-ico="gear"></i>
            </button>
          </div>
        </div>
        <nav class="lb-side">
          <button class="lb-b lb-daily" id="lbDaily">
            <i class="ico" data-ico="dig"></i
            ><span class="lb-dbox"><b data-i18n="Tagesschacht">Tagesschacht</b><small id="lbDailyTxt"></small></span>
          </button>
          <!-- the Wühler with the trophy road to the next hat -->
          <button class="lb-b" id="lbWho">
            <i class="ico" data-ico="crew"></i
            ><span class="lb-dbox"
              ><b data-i18n="Wühler">Wühler</b
              ><span class="lb-roadtrack"><i id="lbRoadBar"></i></span><small id="lbRoadTxt"></small
            ></span>
          </button>
          <button class="lb-b" id="lbCamp">
            <i class="ico" data-ico="crystal"></i
            ><span class="lb-dbox"
              ><b data-i18n="Heimatbergwerk">Heimatbergwerk</b><small><b id="lbKri">0</b> <span id="lbKriTxt"></span></small
            ></span>
          </button>
        </nav>
        <button class="lb-slot" id="lbSlot1" aria-label="Mitspieler einladen" data-i18n-aria="Mitspieler einladen">
          <b>+</b>
        </button>
        <button class="lb-slot" id="lbSlot2" aria-label="Mitspieler einladen" data-i18n-aria="Mitspieler einladen">
          <b>+</b>
        </button>
        <button class="lb-name" id="lbNameTag" aria-label="Name ändern" data-i18n-aria="Name ändern">
          <span id="lbHat"></span><i class="lb-pen">✎</i>
        </button>
        <section class="lb-play">
          <h2 data-i18n="Neues Spiel">Neues Spiel</h2>
          <button class="lb-sel" id="lbGMode">
            <small data-i18n="Modus">Modus</small><b id="lbGModeTxt">Goldrausch</b><em id="lbGModeDesc"></em
            ><span id="lbGModePv" hidden></span>
          </button>
          <button class="lb-go" id="lbPlay"><span id="lbPlayTxt">Spielen</span></button>
          <button class="lb-new" id="lbNew" data-i18n="Neue Welt">Neue Welt</button>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
